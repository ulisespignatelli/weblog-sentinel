name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (parser + detection engine)
        run: node --test
      - name: Syntax check (frontend)
        run: for f in site/js/*.js; do node --check "$f"; done
