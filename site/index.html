<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>WebLog Sentinel — Detección de ataques en logs</title>
<meta name="description" content="Analiza logs de acceso web (Nginx/Apache) y detecta patrones de ataque: inyección SQL, XSS, path traversal, fuerza bruta, escaneo y más. Mapeo a OWASP Top 10 y MITRE ATT&CK. Todo en el navegador.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2322c55e'/><path d='M16 4 6 8v7c0 6 4.2 10.7 10 12 5.8-1.3 10-6 10-12V8z' fill='none' stroke='white' stroke-width='2'/><path d='m11.5 15.5 3 3 6-6' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#22c55e"/><path d="M16 4 6 8v7c0 6 4.2 10.7 10 12 5.8-1.3 10-6 10-12V8z" fill="none" stroke="#06220f" stroke-width="2"/><path d="m11.5 15.5 3 3 6-6" fill="none" stroke="#06220f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>WebLog <b>Sentinel</b></span>
  </div>
  <div class="actions">
    <select class="btn" id="lang" title="Idioma / Language"><option value="es">🇦🇷 ES</option><option value="en">🇬🇧 EN</option></select>
    <a class="btn ghost" href="#about" id="aboutLink">?</a>
  </div>
</header>
<main>
  <section class="intro" id="intro"></section>
  <div class="card" id="inputCard">
    <div class="card-h"><h2 id="inputTitle"></h2><div class="ex-btns" id="exBtns"></div></div>
    <textarea id="input" class="log-in" spellcheck="false" autocomplete="off"></textarea>
    <div class="input-foot"><span id="dropHint" class="hint"></span><span id="parseInfo" class="hint"></span></div>
  </div>
  <div id="results"></div>
  <section class="about" id="about"></section>
</main>
<footer class="foot" id="foot"></footer>
<input type="file" id="fileInput" accept=".log,.txt,text/plain" hidden>
<div id="toast" class="toast" hidden></div>
<script src="js/log.js"></script>
<script src="js/detect.js"></script>
<script src="js/samples.js"></script>
<script src="js/app.js"></script>
</body>
</html>
